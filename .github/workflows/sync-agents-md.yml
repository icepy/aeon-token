name: sync-agents-md

on:
  push:
    branches: [main]
    paths:
      - CLAUDE.md
      - STRATEGY.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regenerate AGENTS.md
        run: node scripts/gen-agents-md.js
      - name: Commit if changed
        run: |
          if git diff --quiet -- AGENTS.md; then
            echo "AGENTS.md already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md
          git commit -m "chore: regenerate AGENTS.md"
          git push
